<style>
:root{
  --bg:#0a0f0d; --panel:#0f1714; --panel2:#13201b; --border:#1f3329;
  --green:#16a34a; --green2:#22c55e; --gold:#d97706; --gold2:#f59e0b;
  --text:#e6f0ea; --muted:#8aa499; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body.light{--bg:#f4f7f5;--panel:#ffffff;--panel2:#eef3f0;--border:#d8e2dc;--text:#12211b;--muted:#5f7168}
body.light .pill.pending{background:#e4e4e4;color:#333}
body.light .badge.admin{background:#fdeccb}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--gold2)}
.hidden{display:none!important}
input,select,textarea{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}
.btn{padding:10px 16px;border:none;border-radius:8px;background:var(--green);color:#03150c;
  font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold);color:#1a0f00}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.btn.ghost:hover{border-color:var(--green)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{margin-bottom:14px}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:32px}
.brand{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px}
.brand b{color:var(--green2)} .brand i{color:var(--gold2);font-style:normal}
.sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:8px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;color:var(--muted);cursor:pointer}
.tabs button.active{background:var(--green);color:#03150c;font-weight:700;border-color:var(--green)}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.err{background:#3a1414;color:#fca5a5;border:1px solid #5a1d1d}
.msg.ok{background:#0f2a1a;color:#86efac;border:1px solid #1d5a35}

/* APP SHELL */
#app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;height:100vh}
.sidebar .brand{font-size:19px;padding:20px 18px;text-align:left;border-bottom:1px solid var(--border)}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;
  color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:3px;cursor:pointer}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:linear-gradient(90deg,rgba(22,163,74,.25),transparent);color:var(--green2)}
.nav a .ic{width:20px;text-align:center}
.side-foot{padding:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.side-foot .who{color:var(--text);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:capitalize}
.badge.admin{background:#3a2a05;color:var(--gold2)}
.badge.expense{background:#0f2a1a;color:var(--green2)}
.badge.payout{background:#0a2030;color:#7dd3fc}
.badge.pending{background:#2a2a2a;color:#bbb}
.main{margin-left:230px;flex:1;padding:26px 30px;width:calc(100% - 230px)}
.page-title{font-size:22px;font-weight:800;margin-bottom:2px}
.page-sub{color:var(--muted);margin-bottom:22px;font-size:13px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.card .lab{color:var(--muted);font-size:12px;margin-bottom:8px}
.card .val{font-size:24px;font-weight:800}
.card .val.g{color:var(--green2)}.card .val.gd{color:var(--gold2)}.card .val.r{color:#fca5a5}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:var(--panel2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:capitalize}
.pill.pending{background:#2a2a2a;color:#ccc}.pill.submitted{background:#3a2a05;color:var(--gold2)}
.pill.approved{background:#0a2030;color:#7dd3fc}.pill.paid{background:#0f2a1a;color:var(--green2)}.pill.upcoming{background:#241a3a;color:#c4b5fd}
.empty{text-align:center;color:var(--muted);padding:30px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;
  width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:16px}

/* MOBILE */
.mtoggle{display:none}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%);transition:.2s;z-index:40}
  .sidebar.open{transform:none}
  .main{margin-left:0;width:100%;padding:18px 14px;padding-top:64px}
  .mtoggle{display:flex;position:fixed;top:12px;left:12px;z-index:45;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    width:42px;height:42px;align-items:center;justify-content:center;color:var(--text);font-size:20px;cursor:pointer}
}
</style>

let ME = null;            // profile {id,email,full_name,role,active}

function toggleTheme(){ const on=document.body.classList.toggle('light'); try{localStorage.setItem('crm_light',on?'1':'0');}catch(e){} updateThemeBtn(); }
function updateThemeBtn(){ const b=$('themeBtn'); if(b) b.textContent = document.body.classList.contains('light')?'\u{1F319} Night mode':'\u2600\uFE0F Day mode'; }

function pickField(id,label,opts,cur){
  cur=cur||''; const inList=opts.includes(cur);

function pickVal(id){

/* ---- CSV backup ---- */
function dlFile(name,text,type){const b=new Blob([text],{type:type||'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function toCSV(rows,cols){const esc2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>esc2(r[c])).join(',')).join('\n');}
async function backup(){
  const d=new Date().toISOString().slice(0,10);
  const sets=[
    ['expenses','expenses',['spent_on','prop_firm','account_size','cost','notes']],
    ['funds','funds',['deposit_date','user_email','amount','notes']],
    ['payouts','payouts',['payout_date','prop_firm','account_size','amount','split_pct','net_amount','status','payout_for','notes']],
    ['equity_accounts','equity',['entry_date','prop_firm','account_size','status','equity','notes']],
    ['pkr_funds','pkr-funds',['fund_date','amount','notes']],
    ['pkr_expenses','pkr-expenses',['entry_date','category','amount','notes']],
    ['riyal_funds','riyal-funds',['fund_date','amount','notes']],
    ['riyal_expenses','riyal-expenses',['entry_date','category','amount','notes']],
    ['profiles','users',['email','role','active','created_at']]
  ];
  let n=0;
  for(const set of sets){
    const {data,error}=await sb.from(set[0]).select('*');
    if(error) continue;
    dlFile(set[1]+'-backup-'+d+'.csv',toCSV(data||[],set[2]));
    n++;
  }
  logAct('Download FULL backup',n+' files');
  alert('\u2705 Full backup ho gaya \u2014 '+n+' CSV files download hui hain (expenses, payouts, funds, equity, PKR, Riyal, users). Inhe apne computer par mehfooz jagah save karein.');
}

function toEmail(u){ u=(u||'').trim(); return u.includes('@') ? u.toLowerCase() : (u.toLowerCase()+'@'+LOGIN_DOMAIN); }

async function doAuth(){
  if(!sb){ authMsg('App not configured yet. (Supabase keys missing.)'); return; }
  const uname=$('auEmail').value.trim(), pass=$('auPass').value;
  if(!uname||!pass){ authMsg('Enter username and password.'); return; }
  $('authBtn').disabled=true;
  try{
    const {error} = await sb.auth.signInWithPassword({email:toEmail(uname),password:pass});
    if(error) throw error;
    await boot();
  }catch(e){ authMsg('Wrong username or password.'); }
  $('authBtn').disabled=false;
}

async function logout(){ await sb.auth.signOut(); location.reload(); }

/* ---- Web Push (phone notifications) ---- */
function urlB64ToUint8(s){const pad='='.repeat((4-s.length%4)%4);const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/');const r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));}
async function enablePush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){
      alert('This browser/device does not support push. On iPhone: first use Share → Add to Home Screen, then OPEN the app from the home screen and try again.'); return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ alert('Notification permission not granted.'); return; }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_email:ME.email},{onConflict:'endpoint'});
    if(error){ alert('Saved on device but could not register: '+error.message); return; }
    alert('✅ Phone notifications enabled on this device. You will get payout alerts here automatically.');
  }catch(e){ alert('Could not enable notifications: '+e.message); }
}

async function loadMe(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return null;
  const {data} = await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  return data || {id:user.id,email:user.email,role:'pending',active:true,full_name:''};
}

async function logAct(action,details){

const NAV = [

let CURRENT='';
function go(k){

async function boot(){

  $('auth').classList.add('hidden');

/* ============================================================
   DASHBOARD (admin)
============================================================ */
async function pageDashboard(){
  $('view').innerHTML = `<div class="page-title">Dashboard</div>
    <div class="page-sub">Overview of all activity</div>
    <div class="cards" id="dCards"></div>
    <div class="panel"><h3>Monthly Expenses vs Payouts</h3><canvas id="dChart" height="90"></canvas></div>`;
  const [{data:exp=[]},{data:pay=[]}] = await Promise.all([
    sb.from('expenses').select('*'), sb.from('payouts').select('*')]);
  const pn=p=>Number(p.net_amount!=null?p.net_amount:p.amount);
  const totalExp = exp.reduce((s,e)=>s+Number(e.cost),0);
  const paidOut  = pay.filter(p=>p.status==='paid').reduce((s,p)=>s+pn(p),0);
  const pendOut  = pay.filter(p=>p.status!=='paid').reduce((s,p)=>s+pn(p),0);
  const net = paidOut - totalExp;
  $('dCards').innerHTML = `
    ${card('Total Expenses',money(totalExp),'r')}
    ${card('Paid Payouts',money(paidOut),'g')}
    ${card('Net Profit',money(net),net>=0?'g':'r')}
    ${card('Pending Payouts',money(pendOut),'gd')}
    ${card('Expense Records',exp.length,'')}
    ${card('Payout Records',pay.length,'')}`;
  drawMonthly(exp,pay);
}
function card(l,v,c){return `<div class="card"><div class="lab">${l}</div><div class="val ${c}">${v}</div></div>`;}
function monthKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');}
let chartRef=null;
function drawMonthly(exp,pay){
  const months={};
  exp.forEach(e=>{const k=monthKey(e.spent_on);(months[k]=months[k]||{e:0,p:0}).e+=Number(e.cost);});
  pay.filter(p=>p.status==='paid').forEach(p=>{const k=monthKey(p.payout_date);(months[k]=months[k]||{e:0,p:0}).p+=Number(p.net_amount!=null?p.net_amount:p.amount);});
  const keys=Object.keys(months).sort().slice(-6);
  if(chartRef)chartRef.destroy();
  chartRef=new Chart($('dChart'),{type:'bar',data:{labels:keys,datasets:[
    {label:'Expenses',data:keys.map(k=>months[k].e),backgroundColor:'#d97706'},

const PERF_RANGES=[[7,'Weekly'],[30,'Monthly'],[90,'3 Months'],[180,'6 Months'],[365,'1 Year'],[1825,'5 Years']];
async function pageReports(){
  $('view').innerHTML=`<div class="page-title">Performance</div>
    <div class="page-sub">Expenses spent vs payouts earned — pick a time period</div>
    <div class="toolbar" id="perfTabs"></div>
    <div class="cards" id="repCards"></div>
    <div class="panel"><h3>📅 Monthly Progress</h3>
      <div class="field" style="max-width:260px"><label>Select month</label>
        <select id="monthSel" onchange="renderMonth()"></select></div>
      <div id="monthOut"></div></div>
    <div class="panel"><h3>By Prop Firm (for the selected period)</h3><div id="repTable"></div></div>
    <div style="margin-top:6px"><button class="btn" onclick="backup()">⬇ Download FULL Backup (all data, CSV)</button></div>`;
  $('perfTabs').innerHTML=PERF_RANGES.map(([d,l])=>`<button class="btn ghost" data-d="${d}" onclick="setPerf(${d},this)">${l}</button>`).join('');
  const [{data:e=[]},{data:p=[]}]=await Promise.all([
    sb.from('expenses').select('*'),sb.from('payouts').select('*')]);
  window._rep={e,p};
  const months=buildMonthList(e,p);
  $('monthSel').innerHTML=months.map((m,i)=>`<option value="${m.v}" ${i===0?'selected':''}>${m.l}</option>`).join('');
  renderMonth();
  setPerf(30, document.querySelector('#perfTabs button[data-d="30"]'));
}
function buildMonthList(e,p){
  const set=new Set();
  [...e.map(x=>x.spent_on),...p.map(x=>x.payout_date)].forEach(d=>{if(d){const s=String(d).slice(0,7); if(/^\d{4}-\d{2}$/.test(s)) set.add(s);}});
  const y=new Date().getFullYear();
  for(let mo=1;mo<=12;mo++){ set.add(y+'-'+String(mo).padStart(2,'0')); }
  const arr=[...set].sort().reverse();
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return arr.map(v=>{const p2=v.split('-'); return {v,l:MN[Number(p2[1])-1]+' '+p2[0]};});
}
function renderMonth(){
  const {e,p}=window._rep; const m=($('monthSel')||{}).value; if(!m)return;
  const pn=x=>Number(x.net_amount!=null?x.net_amount:x.amount);
  const exp=e.filter(x=>String(x.spent_on||'').slice(0,7)===m);
  const pay=p.filter(x=>String(x.payout_date||'').slice(0,7)===m && x.status==='paid');
  const te=exp.reduce((s,x)=>s+Number(x.cost),0);
  const tp=pay.reduce((s,x)=>s+pn(x),0);
  const net=tp-te, roi=te>0?(net/te*100):0;
  $('monthOut').innerHTML=`<div class="cards">${card('Expense (spent)',money(te),'r')}${card('Profit (payouts)',money(tp),'g')}${card('Net Profit',money(net),net>=0?'g':'r')}${card('ROI',roi.toFixed(1)+'%',roi>=0?'gd':'r')}</div>
    <div style="color:var(--muted);font-size:12px;margin-top:6px">${exp.length} expense(s) & ${pay.length} paid payout(s) in this month.</div>`;
}
function setPerf(days,btn){
  window._perfDays=days;
  document.querySelectorAll('#perfTabs button').forEach(b=>b.className='btn ghost');
  if(btn) btn.className='btn';
  renderReport();
}
function renderReport(){
  const {e,p}=window._rep; const days=window._perfDays||30;
  const cut=new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate()-(days-1));
  const inR=d=>{const x=new Date(d); return !isNaN(x) && x>=cut;};
  const pn=x=>Number(x.net_amount!=null?x.net_amount:x.amount);
  const exp=e.filter(x=>inR(x.spent_on)), pay=p.filter(x=>inR(x.payout_date)&&x.status==='paid');
  const te=exp.reduce((s,x)=>s+Number(x.cost),0), tp=pay.reduce((s,x)=>s+pn(x),0);
  const net=tp-te, roi=te>0?((net/te)*100):0;
  $('repCards').innerHTML=`${card('Expense (spent)',money(te),'r')}${card('Payouts (earned)',money(tp),'g')}
    ${card('Net Profit',money(net),net>=0?'g':'r')}${card('ROI',roi.toFixed(1)+'%',roi>=0?'gd':'r')}`;
  const firms={};
  exp.forEach(x=>{(firms[x.prop_firm]=firms[x.prop_firm]||{e:0,p:0}).e+=Number(x.cost);});
  pay.forEach(x=>{(firms[x.prop_firm]=firms[x.prop_firm]||{e:0,p:0}).p+=pn(x);});
  const keys=Object.keys(firms).sort();
  $('repTable').innerHTML = keys.length?`<table><thead><tr>
    <th>Prop Firm</th><th>Expense</th><th>Payouts (net)</th><th>Net Profit</th><th>ROI</th></tr></thead><tbody>
    ${keys.map(k=>{const n=firms[k].p-firms[k].e; const r=firms[k].e>0?(n/firms[k].e*100):0;return `<tr><td>${esc(k)}</td>
      <td>${money(firms[k].e)}</td><td>${money(firms[k].p)}</td>
      <td style="color:${n>=0?'var(--green2)':'#fca5a5'}">${money(n)}</td>
      <td style="color:${r>=0?'var(--gold2)':'#fca5a5'}">${r.toFixed(1)}%</td></tr>`;}).join('')}
    </tbody><tfoot><tr><td style="font-weight:700">Total</td>
      <td style="font-weight:700">${money(keys.reduce((s,k)=>s+firms[k].e,0))}</td>
      <td style="font-weight:700;color:var(--green2)">${money(keys.reduce((s,k)=>s+firms[k].p,0))}</td>
      <td colspan="2"></td></tr></tfoot></table>`:'<div class="empty">No data for this period.</div>';
}

   RIYAL MONTHLY EXPENSES  (user: Ali) — fully separate, currency SAR
============================================================ */
async function pageRiyal(){
  const isAdmin=ME.role==='admin';
  $('view').innerHTML=`<div class="page-title">\u{1F4B5} Riyal Monthly Expenses</div>
    <div class="page-sub">Ali ke monthly kharche (Riyal / SAR) — ye section baaqi CRM se bilkul alag hai.</div>
    <div class="cards" id="riCards"></div>
    <div class="panel"><h3>\u{1F4C5} Month</h3>
      <div class="field" style="max-width:260px"><label>Select month</label><select id="riMonth" onchange="renderRiyal()"></select></div>
      <div id="riMonthOut"></div></div>
    <div class="toolbar">
      <input class="grow" id="riSearch" placeholder="Search category or notes..." oninput="renderRiyal()">
      ${isAdmin?`<button class="btn gold" onclick="riyalFundModal()">\u{1F3E6} Add Fund (to Ali)</button>`:''}
      <button class="btn" onclick="riyalExpModal()">+ Add Expense</button>
    </div>
    <div class="panel" style="padding:0"><div id="riTable"></div></div>`;
  const [{data:ex=[]},{data:fu=[]}]=await Promise.all([
    sb.from('riyal_expenses').select('*').order('entry_date',{ascending:false}),
    sb.from('riyal_funds').select('*').order('fund_date',{ascending:false})]);
  riyalExpData=ex||[]; riyalFundData=fu||[];
  const ms=pkrMonths();
  $('riMonth').innerHTML='<option value="all">All months</option>'+ms.map(m=>`<option value="${m.v}">${m.l}</option>`).join('');
  renderRiyal();
}
function renderRiyal(){
  const isAdmin=ME.role==='admin';
  const q=($('riSearch').value||'').toLowerCase();
  const mSel=($('riMonth')||{}).value||'all';
  let rows=riyalExpData.filter(x=>((x.category||'')+' '+(x.notes||'')).toLowerCase().includes(q));
  if(mSel!=='all') rows=rows.filter(x=>String(x.entry_date||'').slice(0,7)===mSel);
  const received=riyalFundData.reduce((s,x)=>s+Number(x.amount||0),0);
  const spent=riyalExpData.reduce((s,x)=>s+Number(x.amount||0),0);
  const bal=received-spent;
  $('riCards').innerHTML=card('Received from admin',sar(received),'g')+card('Expense total',sar(spent),'r')+card('Balance left',sar(bal),bal>=0?'gd':'r');
  if(mSel==='all'){
    $('riMonthOut').innerHTML='<div style="color:var(--muted);font-size:13px">Kisi month ko select karein us month ka kharcha dekhne ke liye.</div>';
  } else {
    const mrows=riyalExpData.filter(x=>String(x.entry_date||'').slice(0,7)===mSel);
    const mSpent=mrows.reduce((s,x)=>s+Number(x.amount||0),0);
    $('riMonthOut').innerHTML=`<div class="cards">${card('This month spent',sar(mSpent),'r')}${card('Entries',String(mrows.length),'gd')}</div>`;
  }
  $('riTable').innerHTML = rows.length?`<table><thead><tr>
    <th>Date</th><th>Category</th><th>Amount</th><th>Notes</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr>
      <td>${x.entry_date||''}</td><td>${esc(x.category||'')}</td>
      <td style="color:#fca5a5;font-weight:600">${sar(x.amount)}</td>
      <td>${esc(x.notes||'')}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn ghost sm" onclick='riyalExpModal(${JSON.stringify(x)})'>Edit</button>
        ${isAdmin?`<button class="btn danger sm" onclick="delRow('riyal_expenses','${x.id}',pageRiyal)">Del</button>`:''}
      </td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2" style="font-weight:700">Total (shown)</td>
      <td style="font-weight:700;color:#fca5a5">${sar(rows.reduce((s,x)=>s+Number(x.amount||0),0))}</td>
      <td colspan="2"></td></tr></tfoot></table>`:'<div class="empty">No expenses here. Click “+ Add Expense”.</div>';
}
function riyalExpModal(x){
  x=x||{}; const ed=!!x.id;
  openModal(`<h3>${ed?'Edit':'Add'} Expense (Riyal)</h3>
    <div class="row"><div class="field" style="flex:1">${pickField('r_cat','Category *',PKR_CATS,x.category)}</div>
      <div class="field" style="flex:1"><label>Amount (SAR) *</label>
      <input id="r_amt" type="number" step="1" value="${x.amount!=null?x.amount:''}"></div></div>
    <div class="field"><label>Date *</label><input id="r_date" type="date" value="${x.entry_date||new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Notes</label><textarea id="r_notes" rows="2">${esc(x.notes||'')}</textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="r_saveBtn" onclick="saveRiyalExp('${x.id||''}')">Save</button></div>`);
}
async function saveRiyalExp(id){
  const rec={category:pickVal('r_cat'),amount:Number($('r_amt').value||0),
    entry_date:$('r_date').value||new Date().toISOString().slice(0,10),
    notes:$('r_notes').value.trim(),updated_at:new Date().toISOString()};
  if(!rec.category){alert('Category is required');return;}
  const btn=$('r_saveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving...';}
  let err;
  if(id){({error:err}=await sb.from('riyal_expenses').update(rec).eq('id',id));}
  else{rec.created_by=ME.id;({error:err}=await sb.from('riyal_expenses').insert(rec));}
  if(err){alert(err.message);if(btn){btn.disabled=false;btn.textContent='Save';}return;}
  logAct(id?'Update Riyal expense':'Add Riyal expense',rec.category+' '+sar(rec.amount));
  closeModal(); pageRiyal();
}
function riyalFundModal(){
  openModal(`<h3>Add Fund to Ali (Riyal)</h3>
    <div class="row"><div class="field" style="flex:1"><label>Amount (SAR) *</label>
      <input id="rf_amt" type="number" step="1"></div>
      <div class="field" style="flex:1"><label>Date *</label>
      <input id="rf_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
    <div class="field"><label>Notes</label><textarea id="rf_notes" rows="2"></textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="rf_saveBtn" onclick="saveRiyalFund()">Save</button></div>`);
}
async function saveRiyalFund(){
  const rec={amount:Number($('rf_amt').value||0),fund_date:$('rf_date').value||new Date().toISOString().slice(0,10),
    notes:$('rf_notes').value.trim(),created_by:ME.id};
  if(!(rec.amount>0)){alert('Enter a valid amount');return;}
  const btn=$('rf_saveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving...';}

/* ============================================================
   READY TO BUY  (user: Futures) — breached accounts to re-buy, fully separate
============================================================ */
async function pageBuy(){
  const isAdmin=ME.role==='admin';
  $('view').innerHTML=`<div class="page-title">\u{1F6D2} Ready to Buy</div>
    <div class="page-sub">Breached accounts + buying record (Futures user) — ye section baaqi CRM se bilkul alag hai.</div>
    <div class="cards" id="buyCards"></div>
    <div class="toolbar">
      <input class="grow" id="buySearch" placeholder="Search profile, firm or notes..." oninput="renderBuy()">
      <button class="btn ghost" onclick="purchaseModal()">\u{1F4B5} Record Purchase</button>
      <button class="btn" onclick="buyModal()">+ Add Breached Account</button>
    </div>
    <div class="panel"><h3>\u{1F6D2} Ready to Buy</h3><div id="buyReadyTable"></div></div>
    <div class="panel"><h3>\u{1F4B5} Purchases (buying record)</h3><div id="buyPurchTable"></div></div>
    <div id="buyAdmin"></div>
    <div class="panel"><h3>✅ Bought accounts (history)</h3><div id="buyDoneTable"></div></div>`;
  const [{data:acc=[]},{data:pur=[]}]=await Promise.all([
    sb.from('buy_accounts').select('*').order('added_date',{ascending:false}),
    sb.from('buy_purchases').select('*').order('purchase_date',{ascending:false})]);
  buyData=acc||[]; buyPurch=pur||[];
  renderBuy();
}
function buyRows(list,done,isAdmin){
  const invest=isAdmin && !done; const per=BUY_RATE_PER_ACC*BUY_ACCS_PER_FIRM;
  if(!list.length) return '<div class="empty">'+(done?'Abhi tak kuch bought nahi.':'Koi account nahi. Click “+ Add Breached Account”.')+'</div>';
  return `<table><thead><tr>
    <th>${done?'Bought on':'Added'}</th><th>Profile</th><th>Firm</th><th>Account</th><th>Notes</th>${invest?'<th>Invest need</th>':''}<th></th></tr></thead><tbody>
    ${list.map(x=>`<tr>
      <td>${done?(x.bought_date||''):(x.added_date||'')}</td>
      <td style="font-weight:600">${esc(x.profile_name||'')}</td>
      <td>${esc(x.firm||'')}</td><td>${esc(x.account_size||'')}</td>
      <td>${esc(x.notes||'')}</td>
      ${invest?`<td style="color:var(--gold2);font-weight:600">${money(per)}</td>`:''}
      <td style="text-align:right;white-space:nowrap">
        ${done?'':`<button class="btn sm" onclick='purchaseModal("${x.id}",${JSON.stringify({profile_name:x.profile_name,firm:x.firm})})'>Bought for</button>`}
        <button class="btn ghost sm" onclick='buyModal(${JSON.stringify(x)})'>Edit</button>
        ${isAdmin?`<button class="btn danger sm" onclick="delRow('buy_accounts','${x.id}',pageBuy)">Del</button>`:''}
      </td></tr>`).join('')}
    </tbody>${invest?`<tfoot><tr><td colspan="5" style="font-weight:700">Total investment needed (${list.length} firms × ${money(per)})</td><td style="font-weight:700;color:var(--gold2)">${money(list.length*per)}</td><td></td></tr></tfoot>`:''}</table>`;
}
function renderBuy(){
  const isAdmin=ME.role==='admin';
  const q=($('buySearch').value||'').toLowerCase();
  const match=x=>((x.profile_name||'')+' '+(x.firm||'')+' '+(x.account_size||'')+' '+(x.notes||'')).toLowerCase().includes(q);
  const ready=buyData.filter(x=>x.status!=='bought'&&match(x));
  const done=buyData.filter(x=>x.status==='bought'&&match(x));
  const purch=buyPurch.filter(x=>((x.profile_name||'')+' '+(x.firm||'')+' '+(x.notes||'')).toLowerCase().includes(q));
  const totalSpent=buyPurch.reduce((s,x)=>s+Number(x.total||0),0);
  let cards=card('Ready to Buy',String(buyData.filter(x=>x.status!=='bought').length),'gd')
    +card('Bought accounts',String(buyData.filter(x=>x.status==='bought').length),'g');
  if(isAdmin){
    const mkey=new Date().toISOString().slice(0,7);
    const monthSpent=buyPurch.filter(x=>String(x.purchase_date||'').slice(0,7)===mkey).reduce((s,x)=>s+Number(x.total||0),0);
    const invNeed=buyData.filter(x=>x.status!=='bought').length*BUY_RATE_PER_ACC*BUY_ACCS_PER_FIRM;
    cards+=card('Total buying ($ all time)',money(totalSpent),'r')+card('This month buying',money(monthSpent),'r')+card('Investment needed (ready)',money(invNeed),'gd');
  }
  $('buyCards').innerHTML=cards;
  $('buyReadyTable').innerHTML=buyRows(ready,false,isAdmin);
  $('buyDoneTable').innerHTML=buyRows(done,true,isAdmin);
  $('buyPurchTable').innerHTML = purch.length?`<table><thead><tr>
    <th>Date</th><th>Profile</th><th>Firm</th>${isAdmin?'<th>Per acct</th><th>Accounts</th>':''}<th>Total</th><th></th></tr></thead><tbody>
    ${purch.map(x=>`<tr>
      <td>${x.purchase_date||''}</td><td style="font-weight:600">${esc(x.profile_name||'')}</td><td>${esc(x.firm||'')}</td>
      ${isAdmin?`<td>${money(x.amount_per)}</td><td>${x.num_accounts}</td>`:''}
      <td style="color:#fca5a5;font-weight:600">${money(x.total)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn ghost sm" onclick='purchaseModal(null,${JSON.stringify(x)})'>Edit</button>
        ${isAdmin?`<button class="btn danger sm" onclick="delRow('buy_purchases','${x.id}',pageBuy)">Del</button>`:''}
      </td></tr>`).join('')}
    </tbody>${isAdmin?`<tfoot><tr><td colspan="5" style="font-weight:700">Total buying</td><td style="font-weight:700;color:#fca5a5">${money(purch.reduce((s,x)=>s+Number(x.total||0),0))}</td><td></td></tr></tfoot>`:''}</table>`:'<div class="empty">Abhi tak koi purchase record nahi.</div>';
  if(isAdmin) renderBuyAdmin(); else { const a=$('buyAdmin'); if(a) a.innerHTML=''; }
}
function renderBuyAdmin(){
  const agg=(keyfn)=>{const m={}; buyPurch.forEach(x=>{const k=keyfn(x)||'-'; m[k]=(m[k]||0)+Number(x.total||0);}); return m;};
  const sheet=(title,pairs)=>`<div class="panel"><h3>${title}</h3>${pairs.length?`<table><tbody>
    ${pairs.map(p=>`<tr><td>${esc(p[0])}</td><td style="text-align:right;color:#fca5a5;font-weight:600">${money(p[1])}</td></tr>`).join('')}
    </tbody><tfoot><tr><td style="font-weight:700">Total</td><td style="text-align:right;font-weight:700">${money(pairs.reduce((s,p)=>s+p[1],0))}</td></tr></tfoot></table>`:'<div class="empty">No data.</div>'}</div>`;
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthPairs=Object.entries(agg(x=>String(x.purchase_date||'').slice(0,7))).sort((a,b)=>a[0]<b[0]?1:-1)
    .map(p=>{const s=p[0].split('-'); return [ (MN[Number(s[1])-1]||p[0])+' '+s[0], p[1]]; });
  const firmPairs=Object.entries(agg(x=>x.firm)).sort((a,b)=>b[1]-a[1]);
  const profPairs=Object.entries(agg(x=>x.profile_name)).sort((a,b)=>b[1]-a[1]);
  $('buyAdmin').innerHTML = sheet('\u{1F4C5} By Month (buying expense)',monthPairs)
    + sheet('\u{1F3E2} By Firm (invested)',firmPairs)
    + sheet('\u{1F464} By Profile (invested)',profPairs);
}
function buyModal(x){
  x=x||{}; const ed=!!x.id;
  openModal(`<h3>${ed?'Edit':'Add'} Breached Account</h3>
    <div class="field">${pickField('b_prof','Profile name *',BUY_PROFILES,x.profile_name)}</div>
    <div class="field">${pickField('b_firm','Firm *',BUY_FIRMS,x.firm)}</div>
    <div class="row"><div class="field" style="flex:1"><label>Account size (optional)</label>
      <input id="b_size" value="${esc(x.account_size||'150K')}" placeholder="e.g. 150K"></div>
      <div class="field" style="flex:1"><label>Date *</label>
      <input id="b_date" type="date" value="${x.added_date||new Date().toISOString().slice(0,10)}"></div></div>
    <div class="field"><label>Notes</label><textarea id="b_notes" rows="2">${esc(x.notes||'')}</textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="b_saveBtn" onclick="saveBuy('${x.id||''}')">Save</button></div>`);
}
async function saveBuy(id){
  const rec={profile_name:pickVal('b_prof'),firm:pickVal('b_firm'),account_size:$('b_size').value.trim(),
    added_date:$('b_date').value||new Date().toISOString().slice(0,10),notes:$('b_notes').value.trim(),
    updated_at:new Date().toISOString()};
  if(!rec.profile_name){alert('Profile name is required');return;}
  if(!rec.firm){alert('Firm is required');return;}
  const btn=$('b_saveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving...';}
  let err;
  if(id){({error:err}=await sb.from('buy_accounts').update(rec).eq('id',id));}
  else{rec.status='ready'; rec.created_by=ME.id; ({error:err}=await sb.from('buy_accounts').insert(rec));}
  if(err){alert(err.message);if(btn){btn.disabled=false;btn.textContent='Save';}return;}
  logAct(id?'Edit buy account':'Add breached (ready to buy)',rec.profile_name+' '+rec.firm);
  closeModal(); pageBuy();
}
function purchaseModal(accountId,x){
  x=x||{}; const ed=!!x.id;
  openModal(`<h3>${ed?'Edit':'Record'} Purchase</h3>
    <div class="field">${pickField('pu_prof','Profile name *',BUY_PROFILES,x.profile_name)}</div>
    <div class="field">${pickField('pu_firm','Prop firm *',BUY_FIRMS,x.firm)}</div>
    <div class="row"><div class="field" style="flex:1"><label>Amount per account ($) *</label>
      <input id="pu_amt" type="number" step="0.01" value="${x.amount_per!=null?x.amount_per:''}" oninput="puCalc()"></div>
      <div class="field" style="flex:1"><label>No. of accounts *</label>
      <input id="pu_num" type="number" step="1" value="${x.num_accounts!=null?x.num_accounts:1}" oninput="puCalc()"></div></div>
    <div id="pu_total" class="msg ok" style="margin-bottom:14px"></div>
    <div class="field"><label>Date *</label><input id="pu_date" type="date" value="${x.purchase_date||new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Notes</label><textarea id="pu_notes" rows="2">${esc(x.notes||'')}</textarea></div>
    <input type="hidden" id="pu_acc" value="${accountId||''}">
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="pu_saveBtn" onclick="savePurchase('${x.id||''}')">Save</button></div>`);
  puCalc();
}
function puCalc(){
  const a=Number(($('pu_amt')||{}).value||0), n=Number(($('pu_num')||{}).value||0);
  const el=$('pu_total'); if(el) el.innerHTML='Total buying: <b>'+money(a*n)+'</b>  ('+money(a)+' × '+n+' accounts)';
}
async function savePurchase(id){
  const a=Number($('pu_amt').value||0), n=Number($('pu_num').value||0);
  const rec={profile_name:pickVal('pu_prof'),firm:pickVal('pu_firm'),amount_per:a,num_accounts:n,
    total:Math.round(a*n*100)/100,purchase_date:$('pu_date').value||new Date().toISOString().slice(0,10),
    notes:$('pu_notes').value.trim()};
  if(!rec.profile_name){alert('Profile is required');return;}
  if(!rec.firm){alert('Firm is required');return;}
  const btn=$('pu_saveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving...';}
  let err;
  if(id){({error:err}=await sb.from('buy_purchases').update(rec).eq('id',id));}
  else{rec.created_by=ME.id;({error:err}=await sb.from('buy_purchases').insert(rec));}
  if(err){alert(err.message);if(btn){btn.disabled=false;btn.textContent='Save';}return;}
  const accId=($('pu_acc')||{}).value;
  if(accId && !id){ await sb.from('buy_accounts').update({status:'bought',bought_date:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()}).eq('id',accId); }
  logAct(id?'Edit purchase':'Record purchase',rec.profile_name+' '+rec.firm+' '+money(rec.total));
  closeModal(); pageBuy();
}

/* ---------- shared helpers ---------- */
async function delRow(table,id,after){
  if(!confirm('Delete this record?'))return;
  const r=await sb.from(table).delete().eq('id',id);
  if(r.error){alert(r.error.message);return;} logAct('Delete '+table,id); after();
}
function openModal(html){$('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('modalRoot').innerHTML='';}

/* ---------- start ---------- */
if(sb){ sb.auth.onAuthStateChange(async(event)=>{
  if(event==='PASSWORD_RECOVERY'){
    let np=prompt('Set a NEW admin password (minimum 6 characters):');

    if(np.length<6){ alert('Password must be at least 6 characters.'); return; }
    const {error}=await sb.auth.updateUser({password:np});
    alert(error?('Could not update password: '+error.message):'\u2705 Admin password updated. Ab naye password se log in karein.');
  }
}); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
(async()=>{
  if(!sb){ authMsg('Setup not finished: Supabase keys are missing.'); return; }
  try{ if(localStorage.getItem('crm_light')==='1') document.body.classList.add('light'); HIDEBAL=localStorage.getItem('crm_hidebal')==='1'; }catch(e){}
  const {data:{session}} = await sb.auth.getSession();
  if(session) boot();
})();
