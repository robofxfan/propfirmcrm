<style>
:root{
  --bg:#0a0f0d; --panel:#0f1714; --panel2:#13201b; --border:#1f3329;
  --green:#16a34a; --green2:#22c55e; --gold:#d97706; --gold2:#f59e0b;
  --text:#e6f0ea; --muted:#8aa499; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body.light{--bg:#f4f7f5;--panel:#ffffff;--panel2:#eef3f0;--border:#d8e2dc;--text:#12211b;--muted:#5f7168}
body.light .pill.pending{background:#e4e4e4;color:#333}
body.light .badge.admin{background:#fdeccb}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--gold2)}
.hidden{display:none!important}
input,select,textarea{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}
.btn{padding:10px 16px;border:none;border-radius:8px;background:var(--green);color:#03150c;
  font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold);color:#1a0f00}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.btn.ghost:hover{border-color:var(--green)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{margin-bottom:14px}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:32px}
.brand{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px}
.brand b{color:var(--green2)} .brand i{color:var(--gold2);font-style:normal}
.sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:8px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;color:var(--muted);cursor:pointer}
.tabs button.active{background:var(--green);color:#03150c;font-weight:700;border-color:var(--green)}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.err{background:#3a1414;color:#fca5a5;border:1px solid #5a1d1d}
.msg.ok{background:#0f2a1a;color:#86efac;border:1px solid #1d5a35}

/* APP SHELL */
#app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;height:100vh}
.sidebar .brand{font-size:19px;padding:20px 18px;text-align:left;border-bottom:1px solid var(--border)}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;
  color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:3px;cursor:pointer}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:linear-gradient(90deg,rgba(22,163,74,.25),transparent);color:var(--green2)}
.nav a .ic{width:20px;text-align:center}
.side-foot{padding:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.side-foot .who{color:var(--text);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:capitalize}
.badge.admin{background:#3a2a05;color:var(--gold2)}
.badge.expense{background:#0f2a1a;color:var(--green2)}
.badge.payout{background:#0a2030;color:#7dd3fc}
.badge.pending{background:#2a2a2a;color:#bbb}
.badge.almeer{background:#0a2530;color:#67e8f9}
.badge.haji{background:#2a1a05;color:#fbbf24}
.badge.e69{background:#1a052a;color:#d8b4fe}
.main{margin-left:230px;flex:1;padding:26px 30px;width:calc(100% - 230px)}
.page-title{font-size:22px;font-weight:800;margin-bottom:2px}
.page-sub{color:var(--muted);margin-bottom:22px;font-size:13px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.card .lab{color:var(--muted);font-size:12px;margin-bottom:8px}
.card .val{font-size:24px;font-weight:800}
.card .val.g{color:var(--green2)}.card .val.gd{color:var(--gold2)}.card .val.r{color:#fca5a5}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:var(--panel2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:capitalize}
.pill.pending{background:#2a2a2a;color:#ccc}.pill.submitted{background:#3a2a05;color:var(--gold2)}
.pill.approved{background:#0a2030;color:#7dd3fc}.pill.paid{background:#0f2a1a;color:var(--green2)}.pill.upcoming{background:#241a3a;color:#c4b5fd}
.empty{text-align:center;color:var(--muted);padding:30px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;
  width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:16px}

/* MOBILE */
.mtoggle{display:none}
@media(max-width:820px){

  .mtoggle{display:flex;position:fixed;top:12px;left:12px;z-index:45;

    width:42px;height:42px;align-items:center;justify-content:center;color:var(--text);font-size:20px;cursor:pointer}
}
</style>

async function hardRefresh(){
  const b=$('refreshBtn'); if(b){b.disabled=true;b.textContent='🔄 Refreshing...';}
  try{
    if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
    if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update())); }
  }catch(e){}
  location.reload();
}

function pickField(id,label,opts,cur){
  cur=cur||''; const inList=opts.includes(cur);
  return `<label>${esc(label)}</label>
    <select id="${id}_sel" onchange="this.nextElementSibling.style.display=this.value==='__other__'?'block':'none'">
      <option value="" ${!cur?'selected':''}>Select...</option>
      ${opts.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join('')}
      <option value="__other__" ${cur&&!inList?'selected':''}>Other...</option>
    </select>
    <input id="${id}_oth" placeholder="Type ${esc(label)}" style="margin-top:6px;display:${cur&&!inList?'block':'none'}" value="${cur&&!inList?esc(cur):''}">`;
}
function pickVal(id){

/* ---- PDF reports (title: MAJID ALI) ---- */
const pdfN = n => (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2});
function pdfReport(o){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert('PDF library load nahi hui. Internet check karke page refresh karein.');return;}
  try{
    const doc=new window.jspdf.jsPDF();
    const W=doc.internal.pageSize.getWidth();
    doc.setFont('helvetica','bold'); doc.setFontSize(24); doc.setTextColor(20,83,45);
    doc.text('MAJID ALI', W/2, 20, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(60);
    doc.text(o.section, W/2, 28, {align:'center'});
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text('Period: '+o.period+'    |    Generated: '+new Date().toLocaleString(), W/2, 34, {align:'center'});
    doc.setDrawColor(22,163,74); doc.setLineWidth(0.8); doc.line(14,38,W-14,38);
    doc.autoTable({
      startY:42,
      head:[o.columns],
      body:o.rows.length?o.rows:[['-','-','-','-']],
      styles:{fontSize:9,cellPadding:2},
      headStyles:{fillColor:[22,101,52],textColor:255,fontStyle:'bold'},
      alternateRowStyles:{fillColor:[240,247,242]},
      margin:{left:14,right:14}
    });
    let y=doc.lastAutoTable.finalY+10;
    if(o.table2&&o.table2.rows.length){
      if(y>doc.internal.pageSize.getHeight()-40){doc.addPage();y=20;}
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0);
      doc.text(o.table2.title, 14, y-2);
      doc.autoTable({startY:y+2,head:[o.table2.columns],body:o.table2.rows,
        styles:{fontSize:9,cellPadding:2},
        headStyles:{fillColor:[146,64,14],textColor:255,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[250,245,235]},margin:{left:14,right:14}});
      y=doc.lastAutoTable.finalY+10;
    }
    doc.setDrawColor(180); doc.setLineWidth(0.3); doc.line(14,y-5,W-14,y-5);
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    (o.totals||[]).forEach(t=>{
      if(y>doc.internal.pageSize.getHeight()-15){doc.addPage();y=20;}
      doc.setTextColor.apply(doc, t[2]||[0,0,0]);
      doc.text(String(t[0]), 14, y);
      doc.text(String(t[1]), W-14, y, {align:'right'});
      y+=8;
    });
    doc.setFontSize(8); doc.setTextColor(150); doc.setFont('helvetica','normal');
    doc.text('Prop Firm CRM — auto generated report', W/2, doc.internal.pageSize.getHeight()-8, {align:'center'});
    doc.save(o.filename);
  }catch(e){ alert('PDF error: '+e.message); }
}
const PDF_RED=[185,28,28], PDF_GREEN=[21,128,61];
function pdfExpenses(){
  const q=(($('expSearch')||{}).value||'').toLowerCase();
  const rows=expData.filter(e=>(e.prop_firm+' '+(e.notes||'')).toLowerCase().includes(q));
  pdfReport({section:'Expenses — Prop Firm Accounts',period:'Overall',
    columns:['Date','Prop Firm','Account','Cost ($)','Notes'],
    rows:rows.map(e=>[e.spent_on||'',e.prop_firm||'',e.account_size||'',pdfN(e.cost),e.notes||'']),
    totals:[['Total Spent','$ '+pdfN(rows.reduce((s,e)=>s+Number(e.cost||0),0)),PDF_RED]],
    filename:'majid-ali-expenses.pdf'});
}
function pdfPayouts(){
  const q=(($('paySearch')||{}).value||'').toLowerCase();
  let rows=payData.filter(p=>(p.prop_firm+' '+(p.notes||'')).toLowerCase().includes(q));
  if(typeof payFilter!=='undefined'&&payFilter!=='all')rows=rows.filter(p=>p.status===payFilter);
  const pn=p=>Number(p.net_amount!=null?p.net_amount:p.amount);
  pdfReport({section:'Payouts — Profit Withdrawals',period:(typeof payFilter!=='undefined'&&payFilter!=='all')?('Status: '+payFilter):'Overall',
    columns:['Date','Prop Firm','Account','For','Amount ($)','Net ($)','Status'],
    rows:rows.map(p=>[p.payout_date||'',p.prop_firm||'',p.account_size||'',p.payout_for||'-',pdfN(p.amount),pdfN(pn(p)),p.status||'']),
    totals:[['Total Amount','$ '+pdfN(rows.reduce((s,p)=>s+Number(p.amount||0),0))],
            ['Total Net','$ '+pdfN(rows.reduce((s,p)=>s+pn(p),0)),PDF_GREEN]],
    filename:'majid-ali-payouts.pdf'});
}
function pdfMonthlyExp(o){
  const q=(($(o.searchId)||{}).value||'').toLowerCase();
  const mSel=($(o.monthId)||{}).value||'all';
  let rows=o.data.filter(x=>((x.category||'')+' '+(x.notes||'')).toLowerCase().includes(q));
  if(mSel!=='all') rows=rows.filter(x=>String(x.entry_date||'').slice(0,7)===mSel);
  const spent=rows.reduce((s,x)=>s+Number(x.amount||0),0);
  const totals=[['Total Expenses'+(mSel==='all'?'':' ('+mSel+')'),o.cur+' '+pdfN(spent),PDF_RED]];
  if(mSel==='all'&&o.funds){
    const recv=o.funds.reduce((s,x)=>s+Number(x.amount||0),0);
    const allSpent=o.data.reduce((s,x)=>s+Number(x.amount||0),0);
    totals.unshift(['Received from Admin',o.cur+' '+pdfN(recv),PDF_GREEN]);
    totals.push(['Balance Left',o.cur+' '+pdfN(recv-allSpent),(recv-allSpent)>=0?PDF_GREEN:PDF_RED]);
  }
  let frows=o.funds||[];
  if(mSel!=='all') frows=frows.filter(x=>String(x.fund_date||'').slice(0,7)===mSel);
  pdfReport({section:o.section,period:(mSel==='all'?'Overall':mSel),
    columns:['Date','Category','Amount ('+o.cur+')','Notes'],
    rows:rows.map(x=>[x.entry_date||'',x.category||'',pdfN(x.amount),x.notes||'']),
    table2:{title:'Funds received from Admin',columns:['Date','Amount ('+o.cur+')','Remarks'],
      rows:frows.map(x=>[x.fund_date||'',pdfN(x.amount),x.notes||''])},
    totals, filename:o.file+'-'+(mSel==='all'?'overall':mSel)+'.pdf'});
}

/* ---- CSV backup ---- */
function dlFile(name,text,type){const b=new Blob([text],{type:type||'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function toCSV(rows,cols){const esc2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>esc2(r[c])).join(',')).join('\n');}
async function backup(){
  const d=new Date().toISOString().slice(0,10);
  const sets=[
    ['expenses','expenses',['spent_on','prop_firm','account_size','cost','notes']],

    ['riyal_funds','riyal-funds',['fund_date','amount','notes']],
    ['riyal_expenses','riyal-expenses',['entry_date','category','amount','notes']],

    ['haji_expenses','haji-expenses',['entry_date','category','amount','notes']],

/* ---- Web Push (phone notifications) ---- */
function urlB64ToUint8(s){const pad='='.repeat((4-s.length%4)%4);const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/');const r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));}
async function enablePush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){
      alert('This browser/device does not support push. On iPhone: first use Share → Add to Home Screen, then OPEN the app from the home screen and try again.'); return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ alert('Notification permission not granted.'); return; }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_email:ME.email},{onConflict:'endpoint'});
    if(error){ alert('Saved on device but could not register: '+error.message); return; }
    alert('✅ Phone notifications enabled on this device. You will get payout alerts here automatically.');
  }catch(e){ alert('Could not enable notifications: '+e.message); }
}

async function pageDashboard(){

    <div class="cards" id="dCards"></div>
    <div class="panel"><h3>Monthly Expenses vs Payouts</h3><canvas id="dChart" height="90"></canvas></div>`;
  const [{data:exp=[]},{data:pay=[]}] = await Promise.all([
    sb.from('expenses').select('*'), sb.from('payouts').select('*')]);
  const pn=p=>Number(p.net_amount!=null?p.net_amount:p.amount);
  const totalExp = exp.reduce((s,e)=>s+Number(e.cost),0);
  const paidOut  = pay.filter(p=>p.status==='paid').reduce((s,p)=>s+pn(p),0);
  const pendOut  = pay.filter(p=>p.status!=='paid').reduce((s,p)=>s+pn(p),0);
  const net = paidOut - totalExp;
  $('dCards').innerHTML = `
    ${card('Total Expenses',money(totalExp),'r')}

    ${card('Net Profit',money(net),net>=0?'g':'r')}

function card(l,v,c){return `<div class="card"><div class="lab">${l}</div><div class="val ${c}">${v}</div></div>`;}
function monthKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');}
let chartRef=null;
function drawMonthly(exp,pay){
  const months={};
  exp.forEach(e=>{const k=monthKey(e.spent_on);(months[k]=months[k]||{e:0,p:0}).e+=Number(e.cost);});
  pay.filter(p=>p.status==='paid').forEach(p=>{const k=monthKey(p.payout_date);(months[k]=months[k]||{e:0,p:0}).p+=Number(p.net_amount!=null?p.net_amount:p.amount);});
  const keys=Object.keys(months).sort().slice(-6);
  if(chartRef)chartRef.destroy();
  chartRef=new Chart($('dChart'),{type:'bar',data:{labels:keys,datasets:[
    {label:'Expenses',data:keys.map(k=>months[k].e),backgroundColor:'#d97706'},
    {label:'Payouts',data:keys.map(k=>months[k].p),backgroundColor:'#16a34a'}]},
    options:{plugins:{legend:{labels:{color:'#8aa499'}}},
      scales:{x:{ticks:{color:'#8aa499'},grid:{color:'#1f3329'}},
              y:{ticks:{color:'#8aa499'},grid:{color:'#1f3329'}}}}});
}

const PERF_RANGES=[[7,'Weekly'],[30,'Monthly'],[90,'3 Months'],[180,'6 Months'],[365,'1 Year'],[1825,'5 Years']];
async function pageReports(){
  $('view').innerHTML=`<div class="page-title">Performance</div>
    <div class="page-sub">Expenses spent vs payouts earned — pick a time period</div>
    <div class="toolbar" id="perfTabs"></div>
    <div class="cards" id="repCards"></div>
    <div class="panel"><h3>📅 Monthly Progress</h3>
      <div class="field" style="max-width:260px"><label>Select month</label>
        <select id="monthSel" onchange="renderMonth()"></select></div>
      <div id="monthOut"></div></div>
    <div class="panel"><h3>By Prop Firm (for the selected period)</h3><div id="repTable"></div></div>
    <div style="margin-top:6px"><button class="btn" onclick="backup()">⬇ Download FULL Backup (all data, CSV)</button></div>`;
  $('perfTabs').innerHTML=PERF_RANGES.map(([d,l])=>`<button class="btn ghost" data-d="${d}" onclick="setPerf(${d},this)">${l}</button>`).join('');
  const [{data:e=[]},{data:p=[]}]=await Promise.all([
    sb.from('expenses').select('*'),sb.from('payouts').select('*')]);
  window._rep={e,p};
  const months=buildMonthList(e,p);
  $('monthSel').innerHTML=months.map((m,i)=>`<option value="${m.v}" ${i===0?'selected':''}>${m.l}</option>`).join('');
  renderMonth();
  setPerf(30, document.querySelector('#perfTabs button[data-d="30"]'));
}
function buildMonthList(e,p){
  const set=new Set();
  [...e.map(x=>x.spent_on),...p.map(x=>x.payout_date)].forEach(d=>{if(d){const s=String(d).slice(0,7); if(/^\d{4}-\d{2}$/.test(s)) set.add(s);}});
  const y=new Date().getFullYear();
  for(let mo=1;mo<=12;mo++){ set.add(y+'-'+String(mo).padStart(2,'0')); }
  const arr=[...set].sort().reverse();
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return arr.map(v=>{const p2=v.split('-'); return {v,l:MN[Number(p2[1])-1]+' '+p2[0]};});
}
function renderMonth(){
  const {e,p}=window._rep; const m=($('monthSel')||{}).value; if(!m)return;
  const pn=x=>Number(x.net_amount!=null?x.net_amount:x.amount);
  const exp=e.filter(x=>String(x.spent_on||'').slice(0,7)===m);
  const pay=p.filter(x=>String(x.payout_date||'').slice(0,7)===m && x.status==='paid');
  const te=exp.reduce((s,x)=>s+Number(x.cost),0);
  const tp=pay.reduce((s,x)=>s+pn(x),0);
  const net=tp-te, roi=te>0?(net/te*100):0;
  $('monthOut').innerHTML=`<div class="cards">${card('Expense (spent)',money(te),'r')}${card('Profit (payouts)',money(tp),'g')}${card('Net Profit',money(net),net>=0?'g':'r')}${card('ROI',roi.toFixed(1)+'%',roi>=0?'gd':'r')}</div>
    <div style="color:var(--muted);font-size:12px;margin-top:6px">${exp.length} expense(s) & ${pay.length} paid payout(s) in this month.</div>`;
}
function setPerf(days,btn){
  window._perfDays=days;
  document.querySelectorAll('#perfTabs button').forEach(b=>b.className='btn ghost');
  if(btn) btn.className='btn';
  renderReport();
}
function renderReport(){
  const {e,p}=window._rep; const days=window._perfDays||30;
  const cut=new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate()-(days-1));
  const inR=d=>{const x=new Date(d); return !isNaN(x) && x>=cut;};
  const pn=x=>Number(x.net_amount!=null?x.net_amount:x.amount);
  const exp=e.filter(x=>inR(x.spent_on)), pay=p.filter(x=>inR(x.payout_date)&&x.status==='paid');
  const te=exp.reduce((s,x)=>s+Number(x.cost),0), tp=pay.reduce((s,x)=>s+pn(x),0);
  const net=tp-te, roi=te>0?((net/te)*100):0;
  $('repCards').innerHTML=`${card('Expense (spent)',money(te),'r')}${card('Payouts (earned)',money(tp),'g')}
    ${card('Net Profit',money(net),net>=0?'g':'r')}${card('ROI',roi.toFixed(1)+'%',roi>=0?'gd':'r')}`;
  const firms={};
  exp.forEach(x=>{(firms[x.prop_firm]=firms[x.prop_firm]||{e:0,p:0}).e+=Number(x.cost);});
  pay.forEach(x=>{(firms[x.prop_firm]=firms[x.prop_firm]||{e:0,p:0}).p+=pn(x);});
  const keys=Object.keys(firms).sort();
  $('repTable').innerHTML = keys.length?`<table><thead><tr>
    <th>Prop Firm</th><th>Expense</th><th>Payouts (net)</th><th>Net Profit</th><th>ROI</th></tr></thead><tbody>
    ${keys.map(k=>{const n=firms[k].p-firms[k].e; const r=firms[k].e>0?(n/firms[k].e*100):0;return `<tr><td>${esc(k)}</td>
      <td>${money(firms[k].e)}</td><td>${money(firms[k].p)}</td>
      <td style="color:${n>=0?'var(--green2)':'#fca5a5'}">${money(n)}</td>
      <td style="color:${r>=0?'var(--gold2)':'#fca5a5'}">${r.toFixed(1)}%</td></tr>`;}).join('')}
    </tbody><tfoot><tr><td style="font-weight:700">Total</td>
      <td style="font-weight:700">${money(keys.reduce((s,k)=>s+firms[k].e,0))}</td>
      <td style="font-weight:700;color:var(--green2)">${money(keys.reduce((s,k)=>s+firms[k].p,0))}</td>
      <td colspan="2"></td></tr></tfoot></table>`:'<div class="empty">No data for this period.</div>';
}

function eqSizeToNum(s){ if(!s) return 0; s=String(s).trim().toUpperCase().replace(/[$,\s]/g,''); const m=s.match(/^([0-9]*\.?[0-9]+)(K|M)?$/); if(!m) return Number(s)||0; let n=parseFloat(m[1]); if(m[2]==='K')n*=1000; if(m[2]==='M')n*=1000000; return n; }
function eqBal(x){ return x.status==='breached' ? Number(x.equity||0) : eqSizeToNum(x.account_size); }
function renderEq(){
  const isAdmin=ME.role==='admin';

  const liveSum=live.reduce((s,x)=>s+eqBal(x),0), brSum=breached.reduce((s,x)=>s+Number(x.equity||0),0);
  $('eqCards').innerHTML=card('Total LIVE balance',money(liveSum),'g')+card('Live accounts',String(live.length),'gd')

  if(mSel==='all'){

    const mb=eqData.filter(x=>String(x.entry_date||'').slice(0,7)===mSel && x.status==='breached');

      </td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="4" style="font-weight:700">Live total (shown)</td>
      <td style="font-weight:700;color:var(--green2)">${money(rows.filter(x=>x.status!=='breached').reduce((s,x)=>s+eqBal(x),0))}</td>

function eqToggle(){

function pkrMonths(){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const out=[]; let y=2026,m=6;
  for(let i=0;i<13;i++){ out.push({v:y+'-'+String(m).padStart(2,'0'),l:MN[m-1]+' '+y}); m++; if(m>12){m=1;y++;} }
  return out;
}

async function pageBuy(){
  const isAdmin=ME.role==='admin';
  $('view').innerHTML=`<div class="page-title">\u{1F6D2} Ready to Buy</div>
    <div class="page-sub">Breached accounts + buying record (Futures user) — ye section baaqi CRM se bilkul alag hai.</div>

    <div class="toolbar">

      <button class="btn ghost" onclick="purchaseModal()">\u{1F4B5} Record Purchase</button>

    </div>
    <div class="panel"><h3>\u{1F6D2} Ready to Buy</h3><div id="buyReadyTable"></div></div>

    <div id="buyAdmin"></div>

  const [{data:acc=[]},{data:pur=[]}]=await Promise.all([

    sb.from('buy_purchases').select('*').order('purchase_date',{ascending:false})]);
  buyData=acc||[]; buyPurch=pur||[];
  renderBuy();

function buyRows(list,done,isAdmin){
  const invest=isAdmin && !done; const per=BUY_RATE_PER_ACC*BUY_ACCS_PER_FIRM;
  if(!list.length) return '<div class="empty">'+(done?'Abhi tak kuch bought nahi.':'Koi account nahi. Click “+ Add Breached Account”.')+'</div>';
  return `<table><thead><tr>
    <th>${done?'Bought on':'Added'}</th><th>Profile</th><th>Firm</th><th>Account</th><th>Notes</th>${invest?'<th>Invest need</th>':''}<th></th></tr></thead><tbody>
    ${list.map(x=>`<tr>
      <td>${done?(x.bought_date||''):(x.added_date||'')}</td>
      <td style="font-weight:600">${esc(x.profile_name||'')}</td>
      <td>${esc(x.firm||'')}</td><td>${esc(x.account_size||'')}</td>
      <td>${esc(x.notes||'')}</td>
      ${invest?`<td style="color:var(--gold2);font-weight:600">${money(per)}</td>`:''}
      <td style="text-align:right;white-space:nowrap">
        ${done?'':`<button class="btn sm" onclick='purchaseModal("${x.id}",${JSON.stringify({profile_name:x.profile_name,firm:x.firm})})'>Bought for</button>`}
        <button class="btn ghost sm" onclick='buyModal(${JSON.stringify(x)})'>Edit</button>
        ${isAdmin?`<button class="btn danger sm" onclick="delRow('buy_accounts','${x.id}',pageBuy)">Del</button>`:''}
      </td></tr>`).join('')}
    </tbody>${invest?`<tfoot><tr><td colspan="5" style="font-weight:700">Total investment needed (${list.length} firms × ${money(per)})</td><td style="font-weight:700;color:var(--gold2)">${money(list.length*per)}</td><td></td></tr></tfoot>`:''}</table>`;
}
function renderBuy(){
  const isAdmin=ME.role==='admin';
  const q=($('buySearch').value||'').toLowerCase();
  const match=x=>((x.profile_name||'')+' '+(x.firm||'')+' '+(x.account_size||'')+' '+(x.notes||'')).toLowerCase().includes(q);
  const byProfile=(a,b)=>String(a.profile_name||'').toLowerCase().localeCompare(String(b.profile_name||'').toLowerCase())||String(b.added_date||'').localeCompare(String(a.added_date||''));
  const ready=buyData.filter(x=>x.status!=='bought'&&match(x)).sort(byProfile);
  const done=buyData.filter(x=>x.status==='bought'&&match(x)).sort(byProfile);
  const purch=buyPurch.filter(x=>((x.profile_name||'')+' '+(x.firm||'')+' '+(x.notes||'')).toLowerCase().includes(q));
  const totalSpent=buyPurch.reduce((s,x)=>s+Number(x.total||0),0);
  let cards=card('Ready to Buy',String(buyData.filter(x=>x.status!=='bought').length),'gd')
    +card('Bought accounts',String(buyData.filter(x=>x.status==='bought').length),'g');
  if(isAdmin){
    const mkey=new Date().toISOString().slice(0,7);
    const monthSpent=buyPurch.filter(x=>String(x.purchase_date||'').slice(0,7)===mkey).reduce((s,x)=>s+Number(x.total||0),0);
    const invNeed=buyData.filter(x=>x.status!=='bought').length*BUY_RATE_PER_ACC*BUY_ACCS_PER_FIRM;
    cards+=card('Total buying ($ all time)',money(totalSpent),'r')+card('This month buying',money(monthSpent),'r')+card('Investment needed (ready)',money(invNeed),'gd');
  }
  $('buyCards').innerHTML=cards;
  $('buyReadyTable').innerHTML=buyRows(ready,false,isAdmin);
  $('buyDoneTable').innerHTML=buyRows(done,true,isAdmin);
  $('buyPurchTable').innerHTML = purch.length?`<table><thead><tr>
    <th>Date</th><th>Profile</th><th>Firm</th>${isAdmin?'<th>Per acct</th><th>Accounts</th>':''}<th>Total</th><th></th></tr></thead><tbody>
    ${purch.map(x=>`<tr>
      <td>${x.purchase_date||''}</td><td style="font-weight:600">${esc(x.profile_name||'')}</td><td>${esc(x.firm||'')}</td>
      ${isAdmin?`<td>${money(x.amount_per)}</td><td>${x.num_accounts}</td>`:''}
      <td style="color:#fca5a5;font-weight:600">${money(x.total)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn ghost sm" onclick='purchaseModal(null,${JSON.stringify(x)})'>Edit</button>
        ${isAdmin?`<button class="btn danger sm" onclick="delRow('buy_purchases','${x.id}',pageBuy)">Del</button>`:''}
      </td></tr>`).join('')}
    </tbody>${isAdmin?`<tfoot><tr><td colspan="5" style="font-weight:700">Total buying</td><td style="font-weight:700;color:#fca5a5">${money(purch.reduce((s,x)=>s+Number(x.total||0),0))}</td><td></td></tr></tfoot>`:''}</table>`:'<div class="empty">Abhi tak koi purchase record nahi.</div>';
  if(isAdmin) renderBuyAdmin(); else { const a=$('buyAdmin'); if(a) a.innerHTML=''; }
}
function renderBuyAdmin(){
  const agg=(keyfn)=>{const m={}; buyPurch.forEach(x=>{const k=keyfn(x)||'-'; m[k]=(m[k]||0)+Number(x.total||0);}); return m;};
  const sheet=(title,pairs)=>`<div class="panel"><h3>${title}</h3>${pairs.length?`<table><tbody>

const HEDGE_CFG={
  demo:{emoji:'\u{1F517}',label:'Hedging System', sub:'Demo accounts — same / milti-julti equity waale accounts jinhe hedge (pair) kiya ja sakta hai. Auto suggestions. Baaqi CRM se bilkul alag.'},
  sim: {emoji:'\u{1F9EA}',label:'Sim Funded Hedging', sub:'Sim Funded accounts — same / milti-julti equity par auto hedge suggestions. Baaqi CRM se alag.'},
  live:{emoji:'\u{1F4B5}',label:'Live Funded Hedging',sub:'Live Funded accounts — same / milti-julti equity par auto hedge suggestions. Baaqi CRM se alag.'}
};
let hedgeType='demo';
function hedgeRefresh(){ return hedgePage(hedgeType); }
function hedgeSuggestions(list,tol){
  const K=x=>((x.profile_name||'').trim().toLowerCase()+'|'+(x.firm||'').trim().toLowerCase());
  const pairs=[];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i], b=list[j];
    if((a.firm||'').trim().toLowerCase()===(b.firm||'').trim().toLowerCase()) continue;
    const diff=Math.abs(Number(a.equity||0)-Number(b.equity||0));
    if(diff<=tol) pairs.push({a,b,diff});
  }
  pairs.sort((x,y)=>x.diff-y.diff);
  const used=new Set(); const out=[];
  for(const p of pairs){ const ka=K(p.a), kb=K(p.b); if(used.has(ka)||used.has(kb)) continue; used.add(ka); used.add(kb); out.push(p); }
  return out;
}

function renderHedge(){
  const isAdmin=ME.role==='admin';
  const type=hedgeType;
  const q=($('hedgeSearch').value||'').toLowerCase();
  const tol=Number(($('hedgeTol')||{}).value||3000);
  const K=x=>((x.profile_name||'').trim().toLowerCase()+'|'+(x.firm||'').trim().toLowerCase());
  const typed=hedgeData.filter(a=>((a.acct_type||'demo')===type));   // sirf is section (demo/sim/live) ke accounts
  const breached=new Set(hedgeBuy.filter(b=>b.status!=='bought').map(K));
  const boughtT={};
  hedgeBuy.filter(b=>b.status==='bought').forEach(b=>{const k=K(b); const t=new Date(b.updated_at||b.bought_date||b.created_at||0).getTime(); if(!boughtT[k]||t>boughtT[k]) boughtT[k]=t;});
  const isOpen=a=>{ if(a.status!=='traded') return true; const t=new Date(a.updated_at||0).getTime(); return !!(boughtT[K(a)]&&boughtT[K(a)]>t); };
  const avail=typed.filter(a=>!breached.has(K(a)));        // Ready-to-Buy me breached ho to hide
  const openAccts=avail.filter(isOpen);                        // traded nahi (ya buy hone ke baad reset)
  const rows=avail.filter(x=>((x.profile_name||'')+' '+(x.firm||'')+' '+(x.account_size||'')).toLowerCase().includes(q));
  const sug=hedgeSuggestions(openAccts,tol);
  const isLive=(type==='live'||type==='sim');
  const totalEq=avail.reduce((s,x)=>s+(Number(x.equity)||0)*(Number(x.num_accounts)||1),0);
  $('hedgeCards').innerHTML=card('Available accounts',String(avail.length),'gd')+card('Suggested pairs',String(sug.length),'g')

  $('hedgeSugTable').innerHTML = sug.length?`<table><thead><tr>

    </tr>`).join('')}
    </tbody></table>`:'<div class="empty">Koi hedge pair nahi mila (diff \u2264 '+money(tol)+'). Zyada accounts add karein ya diff barhaayein.</div>';
  $('hedgeTable').innerHTML = rows.length?`<table><thead><tr>
    <th>Profile</th><th>Firm</th><th>Account</th><th>Equity</th>${isLive?'<th>Profitable Days</th><th>No of Accounts</th><th>Total Equity</th>':''}<th>Status</th><th>Notes</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr>

      <td><span class="pill ${isOpen(x)?'paid':'submitted'}">${isOpen(x)?'open':'traded'}</span></td>
      <td>${esc(x.notes||'')}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn sm" onclick='hedgeToBuy(${JSON.stringify(x)})'>Breached</button>
        <button class="btn danger sm" onclick="hedgeDelete('${x.id}')">Delete</button>
        <button class="btn ghost sm" onclick='hedgeModal(${JSON.stringify(x)})'>Edit</button>
      </td></tr>`).join('')}
    ${isLive?`<tr><td colspan="6" style="text-align:right;font-weight:700">Full Balance (Available Equity)</td>

  const totAmt=rows.reduce((s,x)=>s+(Number(x.shares)||0)*(Number(x.price)||0),0);
  openModal(`<h3>\u{1F4DC} ${esc(name)} — Full History (${rows.length} buys)</h3>
    <div style="max-height:60vh;overflow:auto"><table><thead><tr>
      <th>Date</th><th>Shares</th><th>Person</th><th>Broker</th><th>Price</th><th>Amount</th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td>${esc(x.buy_date||'')}</td><td style="font-weight:600">${Number(x.shares||0)}</td>
        <td>${esc(x.person||'')}</td><td>${esc(x.broker||'')}</td>
        <td>${cfg.cur(Number(x.price||0))}</td>
        <td style="color:var(--gold2);font-weight:700">${cfg.cur((Number(x.shares)||0)*(Number(x.price)||0))}</td></tr>`).join('')}
      <tr><td style="font-weight:800">Total</td><td style="font-weight:800">${totSh}</td><td></td><td></td><td></td>
        <td style="color:var(--gold2);font-weight:800">${cfg.cur(totAmt)}</td></tr>
    </tbody></table></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}
function stockModal(x){
  x=x||{}; const ed=!!x.id; const cfg=STOCK_CFG[stockMarket]; const showVals=(!ed)||ME.role==='admin';
  openModal(`<h3>${ed?'Edit':'Add'} ${cfg.label} Entry</h3>
    <div class="field"><label>Stock name *</label><input id="s_name" value="${esc(x.stock_name||'')}"></div>
    <div class="field"><label>Person (kis ke naam par) *</label>
      <select id="s_person">${STOCK_PERSONS.map(p=>`<option ${x.person===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="field">${pickField('s_broker','Broker',STOCK_BROKERS,x.broker||'Almeer Securities')}</div>
    <div class="row"><div class="field" style="flex:1"><label>No of shares ${showVals?'*':'(khali = same rahega)'}</label>
      <input id="s_shares" type="number" step="1" value="${showVals&&x.shares!=null?x.shares:''}"></div>
      <div class="field" style="flex:1"><label>Price per share ${showVals?'*':'(khali = same rahega)'}</label>
      <input id="s_price" type="number" step="0.01" value="${showVals&&x.price!=null?x.price:''}"></div></div>
    <div class="field"><label>Date *</label><input id="s_date" type="date" value="${x.buy_date||new Date().toISOString().slice(0,10)}"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="s_saveBtn" onclick="saveStock('${x.id||''}')">Save</button></div>`);
}
async function saveStock(id){
  const rec={market:stockMarket,stock_name:$('s_name').value.trim(),person:$('s_person').value,
    broker:pickVal('s_broker'),
    buy_date:$('s_date').value||new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()};
  const shRaw=$('s_shares').value, prRaw=$('s_price').value;
  if(shRaw!=='') rec.shares=Number(shRaw);      // edit me khali chhora to purana value same rahega
  if(prRaw!=='') rec.price=Number(prRaw);
  if(!rec.stock_name){alert('Stock name required');return;}
  if(!id && !rec.shares){alert('No of shares required');return;}
  const btn=$('s_saveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving...';}
  let err;
  if(id){({error:err}=await sb.from('stock_entries').update(rec).eq('id',id));}
  else{rec.created_by=ME.id;({error:err}=await sb.from('stock_entries').insert(rec));}
  logAct(id?'Edit stock entry':'Add stock entry',rec.stock_name+' — '+rec.person);
  closeModal(); stocksPage(stockMarket);
}

/* ============================================================
   ALMEER PSX  (user: almeer) — Expenses & Earnings, PKR
   Red = expenses, Green = earnings. Net/final amounts = ADMIN ONLY.
============================================================ */
let almeerData=[];
async function pageAlmeer(){
  const isAdmin=ME.role==='admin';
  $('view').innerHTML=`<div class="page-title">💼 Almeer PSX</div>
    <div class="page-sub">Expenses & Earnings — month-wise, 3 / 6 / 9 month aur yearly summary ke saath.</div>
    <div class="cards" id="alCards"></div>
    <div class="panel"><h3>📆 Period Summary</h3><div id="alPeriods"></div></div>
    <div class="panel"><h3>📅 Month</h3>
      <div class="field" style="max-width:260px"><label>Select month</label><select id="alMonth" onchange="renderAlmeer()"></select></div>
      <div id="alMonthOut"></div></div>
    <div class="toolbar">
      <input class="grow" id="alSearch" placeholder="Search category or notes..." oninput="renderAlmeer()">
      ${isAdmin?`<button class="btn ghost" onclick="pdfAlmeer()">⬇ PDF</button>`:''}
      <button class="btn" onclick="almeerModal(null,'earning')">+ Add Earning</button>
      <button class="btn danger" onclick="almeerModal(null,'expense')">+ Add Expense</button>
    </div>
    <div class="panel" style="padding:0"><div id="alTable"></div></div>`;
  const {data}=await sb.from('almeer_entries').select('*').order('entry_date',{ascending:false});
  almeerData=data||[];
  const set=new Set(almeerData.map(x=>String(x.entry_date||'').slice(0,7)).filter(Boolean));
  set.add(new Date().toISOString().slice(0,7));
  const months=[...set].sort().reverse();
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  $('alMonth').innerHTML='<option value="all">All months</option>'+months.map(v=>{const p=v.split('-');return `<option value="${v}">${MN[Number(p[1])-1]||p[1]} ${p[0]}</option>`;}).join('');
  renderAlmeer();
}
function alSum(rows){
  let earn=0,exp=0;
  rows.forEach(x=>{ if(x.kind==='earning') earn+=Number(x.amount||0); else exp+=Number(x.amount||0); });
  return {earn,exp,net:earn-exp};
}
function alCutoff(mo){ const d=new Date(); d.setMonth(d.getMonth()-mo); return d.toISOString().slice(0,10); }
function renderAlmeer(){
  const isAdmin=ME.role==='admin';
  const q=($('alSearch').value||'').toLowerCase();
  const mSel=($('alMonth')||{}).value||'all';
  const t=alSum(almeerData);
  $('alCards').innerHTML =
    card('Total Earnings',pkr(t.earn),'g') +
    card('Total Expenses',pkr(t.exp),'r') +
    (isAdmin?card('Final Net '+(t.net>=0?'(Profit)':'(Loss)'),pkr(t.net),t.net>=0?'gd':'r'):'');
  const periods=[['This Month (1 M)',1],['Quarter (3 M)',3],['Half Year (6 M)',6],['9 Months',9],['Yearly (12 M)',12]];
  $('alPeriods').innerHTML=`<table><thead><tr><th>Period</th><th>Earnings</th><th>Expenses</th>${isAdmin?'<th>Net (final)</th>':''}</tr></thead><tbody>
    ${periods.map(p=>{
      const cut=alCutoff(p[1]);
      const s=alSum(almeerData.filter(x=>String(x.entry_date||'')>=cut));
      return `<tr><td>${p[0]}</td>
        <td style="color:var(--green2);font-weight:600">${pkr(s.earn)}</td>
        <td style="color:#fca5a5;font-weight:600">${pkr(s.exp)}</td>
        ${isAdmin?`<td style="font-weight:700;color:${s.net>=0?'var(--green2)':'#fca5a5'}">${pkr(s.net)}</td>`:''}</tr>`;
    }).join('')}</tbody></table>`;
  if(mSel==='all'){
    $('alMonthOut').innerHTML='<div style="color:var(--muted);font-size:13px">Kisi month ko select karein us month ki earnings/expenses dekhne ke liye.</div>';
  } else {
    const mrows=almeerData.filter(x=>String(x.entry_date||'').slice(0,7)===mSel);
    const s=alSum(mrows);
    $('alMonthOut').innerHTML=`<div class="cards">${card('Month earnings',pkr(s.earn),'g')}${card('Month expenses',pkr(s.exp),'r')}${isAdmin?card('Month net',pkr(s.net),s.net>=0?'gd':'r'):''}</div>`;
  }
  let rows=almeerData.filter(x=>((x.category||'')+' '+(x.notes||'')).toLowerCase().includes(q));
  if(mSel!=='all') rows=rows.filter(x=>String(x.entry_date||'').slice(0,7)===mSel);
  const shown=alSum(rows);
  $('alTable').innerHTML = rows.length?`<table><thead><tr>
    <th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Notes</th><th></th></tr></thead><tbody>
    ${rows.map(x=>{const isE=x.kind==='earning';return `<tr>
      <td>${x.entry_date||''}</td>
      <td><span class="pill ${isE?'paid':'pending'}" style="${isE?'':'background:#3a0d0d;color:#fca5a5'}">${isE?'Earning':'Expense'}</span></td>
      <td>${esc(x.category||'')}</td>
      <td style="color:${isE?'var(--green2)':'#fca5a5'};font-weight:700">${isE?'+':'−'} ${pkr(x.amount)}</td>
      <td>${esc(x.notes||'')}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn ghost sm" onclick='almeerModal(${JSON.stringify(x)})'>Edit</button>
        ${isAdmin?`<button class="btn danger sm" onclick="delRow('almeer_entries','${x.id}',pageAlmeer)">Del</button>`:''}
      </td></tr>`;}).join('')}
    </tbody><tfoot><tr><td colspan="3" style="font-weight:700">Total (shown)</td>
      <td style="font-weight:700;white-space:nowrap">
        <span style="color:var(--green2)">+ ${pkr(shown.earn)}</span> / <span style="color:#fca5a5">− ${pkr(shown.exp)}</span>${isAdmin?` = <span style="color:${shown.net>=0?'var(--green2)':'#fca5a5'}">${pkr(shown.net)}</span>`:''}
      </td><td colspan="2"></td></tr></tfoot></table>`:'<div class="empty">No entries yet. "+ Add Earning" ya "+ Add Expense" par click karein.</div>';
}
function almeerModal(x,kind){
  x=x||{}; const ed=!!x.id; const k=x.kind||kind||'expense';
  openModal(`<h3>${ed?'Edit':'Add'} ${k==='earning'?'Earning':'Expense'} (PKR)</h3>
    <div class="field"><label>Type *</label><select id="al_kind">
      <option value="expense" ${k==='expense'?'selected':''}>Expense (kharcha)</option>
      <option value="earning" ${k==='earning'?'selected':''}>Earning (amdani)</option></select></div>
    <div class="row"><div class="field" style="flex:1"><label>Category *</label>
      <input id="al_cat" value="${esc(x.category||'')}" placeholder="e.g. Commission, Profit, Fees"></div>
      <div class="field" style="flex:1"><label>Amount (PKR) *</label>
      <input id="al_amt" type="number" step="0.01" value="${x.amount!=null?x.amount:''}"></div></div>
    <div class="field"><label>Date *</label><input id="al_date" type="date" value="${x.entry_date||new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Notes</label><textarea id="al_notes" rows="2">${esc(x.notes||'')}</textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="al_saveBtn" onclick="saveAlmeer('${x.id||''}')">Save</button></div>`);
}
async function saveAlmeer(id){
  const rec={kind:$('al_kind').value,category:$('al_cat').value.trim(),amount:Number($('al_amt').value||0),
    entry_date:$('al_date').value||new Date().toISOString().slice(0,10),
    notes:$('al_notes').value.trim(),updated_at:new Date().toISOString()};
  if(!rec.category){alert('Category is required');return;}
  if(!(rec.amount>0)){alert('Enter a valid amount');return;}
  const btn=$('al_saveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving...';}
  let err;
  if(id){({error:err}=await sb.from('almeer_entries').update(rec).eq('id',id));}
  else{rec.created_by=ME.id;({error:err}=await sb.from('almeer_entries').insert(rec));}
  if(err){alert(err.message);if(btn){btn.disabled=false;btn.textContent='Save';}return;}
  logAct(id?'Update Almeer entry':'Add Almeer entry',rec.kind+' '+rec.category+' '+pkr(rec.amount));
  closeModal(); pageAlmeer();
}

/* ---------- shared helpers ---------- */
async function delRow(table,id,after){
  if(!confirm('Delete this record?'))return;
  const r=await sb.from(table).delete().eq('id',id);
  if(r.error){alert(r.error.message);return;} logAct('Delete '+table,id); after();
}
function openModal(html){$('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('modalRoot').innerHTML='';}

/* ---------- start ---------- */
if(sb){ sb.auth.onAuthStateChange(async(event)=>{
  if(event==='PASSWORD_RECOVERY'){
    let np=prompt('Set a NEW admin password (minimum 6 characters):');
    if(np===null) return;
    if(np.length<6){ alert('Password must be at least 6 characters.'); return; }
    const {error}=await sb.auth.updateUser({password:np});
    alert(error?('Could not update password: '+error.message):'✅ Admin password updated. Ab naye password se log in karein.');
  }
}); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
(async()=>{
  if(!sb){ authMsg('Setup not finished: Supabase keys are missing.'); return; }
  try{ if(localStorage.getItem('crm_light')==='1') document.body.classList.add('light'); HIDEBAL=localStorage.getItem('crm_hidebal')==='1'; }catch(e){}
  const {data:{session}} = await sb.auth.getSession();
  if(session) boot();
})();
</script>
